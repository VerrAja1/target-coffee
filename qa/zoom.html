<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>QA zoom</title>
    <style>
      html, body { margin: 0; background: #2b2b2b; overflow: hidden; }
      #frame { border: 0; display: block; zoom: var(--scale); }
    </style>
  </head>
  <body>
    <iframe id="frame" title="qa" src="/"></iframe>
    <script>
      const params = new URLSearchParams(location.search)
      const w = Number(params.get('w') || 1440)
      const h = Number(params.get('h') || 900)
      const s = Number(params.get('s') || 0.625)
      const frame = document.getElementById('frame')
      frame.width = w
      frame.height = h
      document.documentElement.style.setProperty('--scale', s)
    </script>
  </body>
</html>
