<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>QA frame</title>
    <style>
      html, body { margin: 0; background: #2b2b2b; overflow: hidden; }
      #frame { border: 0; display: block; transform-origin: top left; }
    </style>
  </head>
  <body>
    <iframe id="frame" title="qa"></iframe>
    <script>
      const params = new URLSearchParams(location.search)
      const width = Number(params.get('w') || 390)
      const height = Number(params.get('h') || 844)
      const scale = Number(params.get('s') || 1)
      const frame = document.getElementById('frame')
      frame.width = width
      frame.height = height
      frame.style.width = width + 'px'
      frame.style.height = height + 'px'
      frame.style.transform = 'scale(' + scale + ')'
      frame.src = '/'
    </script>
  </body>
</html>
