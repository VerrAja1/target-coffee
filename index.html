<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Target Coffee — Your Neighbourhood Coffee Shop</title>
    <meta
      name="description"
      content="Specialty coffee shop di Wijaya Kusuma, Jakarta Barat. La Marzocco, filter coffee Tier 1–3, ceremonial matcha, dan comfort food nusantara. Buka setiap hari 08.00."
    />
    <meta name="theme-color" content="#12100E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Target Coffee" />
    <meta property="og:title" content="Target Coffee — Your Neighbourhood Coffee Shop" />
    <meta
      property="og:description"
      content="Specialty coffee, ceremonial matcha, dan comfort food nusantara di Wijaya Kusuma, Jakarta Barat."
    />
    <meta property="og:image" content="/images/01-interior-bar-lamarzocco.jpg" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CafeOrCoffeeShop",
        "name": "Target Coffee",
        "slogan": "Your Neighbourhood Coffee Shop",
        "servesCuisine": ["Coffee", "Indonesian"],
        "priceRange": "Rp16.000 – Rp79.000",
        "telephone": "+6285194498342",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Jl. Kusuma V, Wijaya Kusuma, Grogol Petamburan",
          "addressLocality": "Jakarta Barat",
          "addressRegion": "DKI Jakarta",
          "addressCountry": "ID"
        },
        "sameAs": ["https://instagram.com/target.coffee.id", "https://tiktok.com/@target.coffee.id"],
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday"],
            "opens": "08:00",
            "closes": "21:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Friday", "Saturday", "Sunday"],
            "opens": "08:00",
            "closes": "22:00"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
